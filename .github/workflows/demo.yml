name: Verify the release story
on:
  push:
    branches: [main, codex/reference-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  reproduce-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-demo-evidence
          path: .demo-results/
          include-hidden-files: true
